
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finance Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 35px 15px;
        }
        .card {
            max-width: 650px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #0001;
        }
        h1 { color: #3730a3; }
        input, select, button {
            padding: 11px;
            margin: 6px 0;
            box-sizing: border-box;
            width: 100%;
        }
        button {
            background: #4f46e5;
            color: white;
            border: 0;
            cursor: pointer;
        }
        .summary { font-weight: bold; margin: 20px 0; }
        li { padding: 8px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="card">
    <h1>Finance Tracker</h1>
    <p>Manage your income and expenses.</p>

    <form id="transactionForm">
        <input id="description" placeholder="Transaction description" required>
        <input id="amount" type="number" min="0.01" step="0.01"
               placeholder="Amount (₹)" required>
        <select id="type">
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
        <button type="submit" id="addButton">Add Transaction</button>
    </form>

    <div class="summary">
        Income: ₹<span id="income">0.00</span><br>
        Expenses: ₹<span id="expenses">0.00</span><br>
        Balance: ₹<span id="balance">0.00</span>
    </div>

    <h3>Transactions</h3>
    <ul id="transactions"></ul>
    <p id="message" role="status"></p>
</div>

<script>
    const transactions = [];
    const form = document.getElementById("transactionForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const description = document.getElementById("description").value.trim();
        const amount = Number(document.getElementById("amount").value);
        const type = document.getElementById("type").value;

        if (!description || !Number.isFinite(amount) || amount <= 0) {
            document.getElementById("message").textContent =
                "Enter a valid description and amount.";
            return;
        }

        transactions.push({ description, amount, type });
        renderTransactions();
        form.reset();
        document.getElementById("message").textContent =
            "Transaction added successfully.";
    });

    function renderTransactions() {
        let income = 0, expenses = 0;
        const list = document.getElementById("transactions");
        list.replaceChildren();

        transactions.forEach(t => {
            if (t.type === "Income") income += t.amount;
            else expenses += t.amount;

            const item = document.createElement("li");
            item.textContent = `${t.description} - ${t.type}: ₹${t.amount.toFixed(2)}`;
            list.appendChild(item);
        });

        document.getElementById("income").textContent = income.toFixed(2);
        document.getElementById("expenses").textContent = expenses.toFixed(2);
        document.getElementById("balance").textContent =
            (income - expenses).toFixed(2);
    }
</script>
</body>
</html>
